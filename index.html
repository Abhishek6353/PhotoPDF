<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official support and privacy information for PhotoPDF: Image to PDF.">
  <meta name="theme-color" content="#6366f1">
  <title>PhotoPDF</title>
  <style>
    :root {
      color-scheme: light dark;
      --brand:#6366f1;--brand-strong:#4f46e5;--ink:#17171c;--muted:#676772;
      --surface:#ffffff;--border:#e4e4eb;--background:#f3f3f8;--focus:rgba(79,70,229,.35);
    }
    *{box-sizing:border-box;}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--background);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
    main{width:min(100%,720px);padding:clamp(30px,7vw,58px);border:1px solid var(--border);border-radius:30px;background:var(--surface);box-shadow:0 22px 60px rgba(40,40,70,.11);}
    .app-icon{width:76px;height:76px;border-radius:20px;box-shadow:0 12px 28px rgba(79,70,229,.22);}
    h1{margin:24px 0 10px;font-size:clamp(38px,8vw,60px);line-height:1;letter-spacing:-.05em;}
    .intro{max-width:540px;margin:0 0 32px;color:var(--muted);font-size:18px;}
    .links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
    .card{min-height:140px;padding:22px;border:1px solid var(--border);border-radius:20px;color:var(--ink);text-decoration:none;transition:transform 160ms ease,border-color 160ms ease,box-shadow 160ms ease;}
    .card:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 12px 28px rgba(79,70,229,.12);}
    .card:focus-visible{outline:3px solid var(--focus);outline-offset:4px;}
    .card strong{display:block;margin-bottom:6px;color:var(--brand-strong);font-size:20px;}
    .card span{color:var(--muted);}
    footer{margin-top:30px;color:var(--muted);font-size:13px;}
    @media(max-width:560px){.links{grid-template-columns:1fr;}main{border-radius:24px;}}
    @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;}}
    @media(prefers-color-scheme:dark){:root{--brand:#7376ff;--brand-strong:#a5b4fc;--ink:#f5f5f7;--muted:#b1b1bb;--surface:#18181d;--border:#35353d;--background:#0f0f13;--focus:rgba(165,180,252,.4);}main{box-shadow:0 22px 60px rgba(0,0,0,.3);}}
  </style>
</head>
<body>
  <main>
    <img class="app-icon" src="support/app-icon.png" alt="PhotoPDF app icon">
    <h1>PhotoPDF</h1>
    <p class="intro">Official help and privacy information for PhotoPDF: Image to PDF.</p>
    <div class="links">
      <a class="card" href="support/"><strong>Support</strong><span>Instructions, troubleshooting, and contact information.</span></a>
      <a class="card" href="privacy/"><strong>Privacy Policy</strong><span>How PhotoPDF handles photos, PDFs, and device permissions.</span></a>
    </div>
    <footer>© 2026 Abhisheksingh Kurmi</footer>
  </main>
</body>
</html>
